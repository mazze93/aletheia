name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step and no dependency cache: the package has no runtime
      # dependencies on purpose. If this job ever needs `pip install`, that is
      # a design regression worth noticing here.
      - name: tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -t . -v

      - name: eval corpus
        run: PYTHONPATH=src python3 -m unittest tests.test_evals -v

  # Two implementations of the same contract drift silently unless something
  # makes them argue. The golden file is the sworn statement; a difference
  # fails the build. Which side is *correct* is a policy decision, recorded
  # before either is changed — see parity/README.md.
  #
  # Modelled on cognitive/stratum's reference-oracle + golden-projection gate,
  # which solved this exact problem for its own dual implementation.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: typescript

      # Gate 1 — the golden is a projection, not a document. If it drifts from
      # the oracle, someone hand-edited it or changed assess.py and forgot to
      # regenerate. Without this, a stale golden would happily certify a port
      # that no longer matches anything.
      - name: golden file is current
        run: |
          python3 parity/emit.py > /tmp/golden.expected.json
          diff -u parity/assess.golden.json /tmp/golden.expected.json \
            || { echo "::error::parity/assess.golden.json is stale — regenerate with 'python3 parity/emit.py > parity/assess.golden.json'"; exit 1; }

      # Gate 2 — the port answers the same questions and must give the same
      # answers. Covers weights, thresholds, the trust table, the combo
      # penalty, the urgency multiplier, regex dialect differences, match
      # ordering, dedupe, and the per-family caps.
      - name: TypeScript port matches the oracle
        run: |
          npx tsx parity/emit.ts > /tmp/ts.json
          python3 parity/compare.py parity/assess.golden.json /tmp/ts.json

      # Gate 3 — the mutation corpus is generated, so it must be regenerable.
      # A hand-edited corpus is a corpus someone can quietly shrink.
      - name: mutation corpus is current
        run: |
          (cd parity && PYTHONPATH=. python3 unicode_boundary_mutations.py) > /tmp/mutations.expected
          diff -u parity/mutations.jsonl /tmp/mutations.expected \
            || { echo "::error::parity/mutations.jsonl is stale — regenerate with 'cd parity && PYTHONPATH=. python3 unicode_boundary_mutations.py > mutations.jsonl'"; exit 1; }

      - name: mutation golden is current
        run: |
          python3 parity/emit_mutations.py > /tmp/mutations.golden.expected
          diff -u parity/mutations.golden.json /tmp/mutations.golden.expected \
            || { echo "::error::parity/mutations.golden.json is stale — regenerate with 'python3 parity/emit_mutations.py > parity/mutations.golden.json'"; exit 1; }

      # Gate 4 — 651 cases: every detection atom, decorated at both boundaries
      # with every edge character. This is what closes the issue-3 family rather
      # than the eleven fixtures that happened to expose it. It found the U+FEFF
      # whitespace divergence that the 69 hand-written vectors missed.
      - name: TypeScript port matches the oracle under Unicode mutation
        run: |
          npx tsx parity/emit_mutations.ts > /tmp/ts-mutations.json
          python3 parity/compare.py parity/mutations.golden.json /tmp/ts-mutations.json

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: typescript
      - run: npm run typecheck
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
